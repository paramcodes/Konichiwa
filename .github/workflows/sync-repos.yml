name: Sync Konichiwa Projects

on:
  schedule:
    # Runs hourly
    - cron: "0 * * * *"
  workflow_dispatch: # Manual trigger button in GitHub UI

env:
  CONICHIWA_URL: https://konichiwa-five.vercel.app

jobs:
  sync-repos:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm ci || npm install

      - name: Find and process repos with topic:konichiwa
        run: node scripts/sync-conichiwa.js
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CONICHIWA_URL: https://konichiwa-five.vercel.app
